<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="gradeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6f7cff"/>
      <stop offset="100%" style="stop-color:#4fd1c5"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#090a10"/>
  
  <!-- Decorative Elements -->
  <circle cx="150" cy="120" r="100" fill="url(#gradeGradient)" opacity="0.1"/>
  <circle cx="1050" cy="480" r="130" fill="url(#gradeGradient)" opacity="0.08"/>
  
  <!-- Main Content -->
  <text x="600" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#f4f6fb">Grade Calculator</text>
  <text x="600" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#a6aec3">What Grade Do I Need on My Final?</text>
  
  <!-- Calculator Icon -->
  <g transform="translate(500, 360)">
    <rect x="0" y="0" width="200" height="180" rx="12" fill="#111421" stroke="#6f7cff" stroke-width="3"/>
    <text x="100" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#4fd1c5">85%</text>
    <text x="100" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#a6aec3">Current Grade</text>
    <text x="100" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#a6aec3">Target: 90%</text>
    <text x="100" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#6f7cff">Need: 95%</text>
  </g>
  
  <!-- Features -->
  <g transform="translate(200, 420)">
    <circle cx="20" cy="20" r="8" fill="#4fd1c5"/>
    <text x="40" y="28" font-family="Arial, sans-serif" font-size="16" fill="#f4f6fb">Final Exam Calculator</text>
  </g>
  <g transform="translate(200, 460)">
    <circle cx="20" cy="20" r="8" fill="#4fd1c5"/>
    <text x="40" y="28" font-family="Arial, sans-serif" font-size="16" fill="#f4f6fb">Grade Predictor</text>
  </g>
  <g transform="translate(500, 420)">
    <circle cx="20" cy="20" r="8" fill="#6f7cff"/>
    <text x="40" y="28" font-family="Arial, sans-serif" font-size="16" fill="#f4f6fb">Instant Results</text>
  </g>
  <g transform="translate(500, 460)">
    <circle cx="20" cy="20" r="8" fill="#6f7cff"/>
    <text x="40" y="28" font-family="Arial, sans-serif" font-size="16" fill="#f4f6fb">No Sign-up</text>
  </g>
  
  <!-- Branding -->
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#a6aec3">StudyTools • StudyHelper • StudeTools</text>
</svg>