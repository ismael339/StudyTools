name: Weekly Study Tips Email

on:
  schedule:
    # Every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  send-weekly-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Send weekly email with Resend
        run: |
          # Get day of week for dynamic content
          DAY_OF_WEEK=$(date +%u)
          WEEK_NUMBER=$(date +%U)

          # Send email using Resend API
          curl -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "StudyTools <noreply@studytools.pro>",
              "subject": "📚 Tu dosis semanal de study tips - Semana '"${WEEK_NUMBER}"'",
              "html": "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Study Tips Semanales</title><style>body{font-family:Arial,sans-serif;line-height:1.6;color:#333;max-width:600px;margin:0 auto;padding:20px;background:#f4f4f4}.container{background:#fff;border-radius:10px;padding:30px;box-shadow:0 2px 10px rgba(0,0,0,.1)}.header{background:linear-gradient(135deg,#6f7cff,#4fd1c5);color:#fff;padding:20px;border-radius:10px 10px 0 0;text-align:center}.header h1{margin:0;font-size:24px}.tip-box{background:#f9f9f9;border-left:4px solid #6f7cff;padding:15px;margin:20px 0}.tip-box h3{margin-top:0;color:#6f7cff}.cta{background:linear-gradient(135deg,#6f7cff,#4fd1c5);color:#fff;padding:12px 30px;text-decoration:none;border-radius:5px;display:inline-block;margin:20px 0;font-weight:bold}.footer{margin-top:30px;padding-top:20px;border-top:1px solid #eee;color:#777;font-size:12px;text-align:center}</style></head><body><div class=\"container\"><div class=\"header\"><h1>🎓 Study Tips de la Semana</h1></div><div class=\"content\"><p>Hola estudiante,</p><p>¡Es lunes! Ya sabes lo que significa: tiempo de nuevos tips para estudiar mejor esta semana.</p><div class=\"tip-box\"><h3>💡 Tip del día: La regla de los 5 minutos</h3><p>¿Te cuesta empezar a estudiar? Comprométete a estudiar solo 5 minutos. Casi siempre, una vez que empiezas, seguirás más tiempo. El truco es vencer la resistencia inicial.</p></div><div class=\"tip-box\"><h3>🎯 Tu reto de esta semana</h3><p>Elige una materia donde estás luchando y dedícale 20 minutos cada día esta semana. Pequeños pasos consistentes logran grandes resultados.</p></div><p><strong>Herramientas que te pueden ayudar esta semana:</strong></p><ul><li>🧠 <a href=\"https://www.studytools.pro/study-assistant.html\">AI Tutor</a> - Pregunta dudas difíciles</li><li>📊 <a href=\"https://www.studytools.pro/gpa-calculator.html\">GPA Calculator</a> - Calcula tu promedio</li><li>⏱️ <a href=\"https://www.studytools.pro/pomodoro-timer.html\">Pomodoro Timer</a> - Estudia en bloques enfocados</li></ul><p><a href=\"https://www.studytools.pro\" class=\"cta\">Empezar a estudiar ahora →</a></p><p>¡Tú puedes lograrlo! Estamos aquí para apoyarte en tu camino académico.</p></div><div class=\"footer\"><p>© 2026 StudyTools.pro - Herramientas de estudio gratuitas para estudiantes</p><p><a href=\"https://www.studytools.pro/privacy.html\">Política de privacidad</a> | <a href=\"https://www.studytools.pro\">Sitio web</a></p></div></div></body></html>",
              "to": ["all"]
            }'
