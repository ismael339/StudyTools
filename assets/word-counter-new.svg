<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="wordGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6f7cff"/>
      <stop offset="100%" style="stop-color:#4fd1c5"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#090a10"/>
  
  <!-- Decorative Elements -->
  <circle cx="140" cy="110" r="85" fill="url(#wordGradient)" opacity="0.1"/>
  <circle cx="1060" cy="510" r="105" fill="url(#wordGradient)" opacity="0.08"/>
  
  <!-- Main Content -->
  <text x="600" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#f4f6fb">Word Counter</text>
  <text x="600" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#a6aec3">Count Words, Characters & Reading Time</text>
  
  <!-- Word Counter Icon -->
  <g transform="translate(480, 360)">
    <rect x="0" y="0" width="240" height="180" rx="12" fill="#111421" stroke="#6f7cff" stroke-width="3"/>
    <text x="120" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#a6aec3">Words:</text>
    <text x="120" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#4fd1c5">2,450</text>
    <text x="120" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#a6aec3">Characters:</text>
    <text x="120" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#6f7cff">12,347</text>
  </g>
  
  <!-- Features -->
  <g transform="translate(200, 420)">
    <circle cx="20" cy="20" r="8" fill="#4fd1c5"/>
    <text x="40" y="28" font-family="Arial, sans-serif" font-size="16" fill="#f4f6fb">Real-time Counting</text>
  </g>
  <g transform="translate(200, 460)">
    <circle cx="20" cy="20" r="8" fill="#4fd1c5"/>
    <text x="40" y="28" font-family="Arial, sans-serif" font-size="16" fill="#f4f6fb">Reading Time Estimator</text>
  </g>
  <g transform="translate(500, 420)">
    <circle cx="20" cy="20" r="8" fill="#6f7cff"/>
    <text x="40" y="28" font-family="Arial, sans-serif" font-size="16" fill="#f4f6fb">Keyword Density</text>
  </g>
  <g transform="translate(500, 460)">
    <circle cx="20" cy="20" r="8" fill="#6f7cff"/>
    <text x="40" y="28" font-family="Arial, sans-serif" font-size="16" fill="#f4f6fb">Paragraph Analysis</text>
  </g>
  
  <!-- Branding -->
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#a6aec3">StudyTools • StudyHelper • StudeTools</text>
</svg>