<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="mathGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6f7cff"/>
      <stop offset="100%" style="stop-color:#4fd1c5"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#090a10"/>
  
  <!-- Decorative Elements -->
  <circle cx="130" cy="105" r="88" fill="url(#mathGradient)" opacity="0.1"/>
  <circle cx="1070" cy="505" r="108" fill="url(#mathGradient)" opacity="0.08"/>
  
  <!-- Main Content -->
  <text x="600" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#f4f6fb">How to Study for a Math Test</text>
  <text x="600" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#a6aec3">Proven Strategies to Get an A on Your Math Exam</text>
  
  <!-- Math Study Icon -->
  <g transform="translate(500, 360)">
    <rect x="0" y="0" width="200" height="180" rx="12" fill="#111421" stroke="#6f7cff" stroke-width="3"/>
    <text x="100" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#4fd1c5">A+</text>
    <text x="100" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#a6aec3">Math Test</text>
    <text x="100" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#6f7cff">Practice</text>
    <text x="100" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#a6aec3">Succeed</text>
  </g>
  
  <!-- Features -->
  <g transform="translate(200, 420)">
    <circle cx="20" cy="20" r="8" fill="#4fd1c5"/>
    <text x="40" y="28" font-family="Arial, sans-serif" font-size="16" fill="#f4f6fb">Early Study Start</text>
  </g>
  <g transform="translate(200, 460)">
    <circle cx="20" cy="20" r="8" fill="#4fd1c5"/>
    <text x="40" y="28" font-family="Arial, sans-serif" font-size="16" fill="#f4f6fb">Practice Problems</text>
  </g>
  <g transform="translate(500, 420)">
    <circle cx="20" cy="20" r="8" fill="#6f7cff"/>
    <text x="40" y="28" font-family="Arial, sans-serif" font-size="16" fill="#f4f6fb">Focus on Weak Areas</text>
  </g>
  <g transform="translate(500, 460)">
    <circle cx="20" cy="20" r="8" fill="#6f7cff"/>
    <text x="40" y="28" font-family="Arial, sans-serif" font-size="16" fill="#f4f6fb">Test-Taking Tips</text>
  </g>
  
  <!-- Branding -->
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#a6aec3">StudyTools • StudyHelper • StudeTools</text>
</svg>