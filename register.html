<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create an account | StudyTools</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/css/auth-workspace.css"></head><body><main class="auth-shell"><section class="auth-card"><a class="auth-logo" href="/">StudyTools</a><h1>Create your account</h1><p class="auth-sub">Save your study progress and return to your workspace.</p><form id="register-form"><div class="auth-group"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div><div class="auth-group"><label for="password">Password</label><input id="password" type="password" required minlength="6" autocomplete="new-password"></div><div class="auth-group"><label for="confirm">Confirm password</label><input id="confirm" type="password" required minlength="6" autocomplete="new-password"></div><button class="auth-button">Create free account</button></form><div class="auth-divider">or continue with</div><button class="auth-button alt" id="google">Continue with Google</button><div class="auth-error" id="error" hidden></div><div class="auth-links">Already have an account? <a href="/login.html">Log in</a><br><a href="/">Back to StudyTools</a></div></section></main><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><script src="/js/firebase-config.js"></script><script>firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),error=document.querySelector('#error');function show(e){error.hidden=false;error.textContent=e}document.querySelector('#register-form').addEventListener('submit',async e=>{e.preventDefault();if(password.value!==confirm.value)return show('Passwords do not match.');try{const r=await auth.createUserWithEmailAndPassword(email.value,password.value);await db.collection('users').doc(r.user.email).set({email:r.user.email,createdAt:firebase.firestore.FieldValue.serverTimestamp(),plan:'free',achievements:[],badges:[]});location.href='/dashboard.html'}catch(x){show(x.message)}});document.querySelector('#google').onclick=async()=>{try{const r=await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());const ref=db.collection('users').doc(r.user.email);if(!(await ref.get()).exists)await ref.set({email:r.user.email,plan:'free',achievements:[],badges:[]});location.href='/dashboard.html'}catch(x){show(x.message)}};</script></body></html>
