# Removed: this used to run on every push and email a hard-coded personal
# address. It also failed whenever the Resend secret was missing. Deployment
# notifications are handled by Vercel, so this workflow is no longer needed.
name: Notify on deploy

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the site is up
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://www.studytools.pro/ || echo 000)
          echo "studytools.pro returned HTTP $code"
          if [ "$code" != "200" ]; then
            echo "The site is not responding correctly."
            exit 1
          fi