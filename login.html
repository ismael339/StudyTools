<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | StudyTools</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/css/auth-workspace.css"></head><body><main class="auth-shell"><section class="auth-card"><a class="auth-logo" href="/">StudyTools</a><h1>Welcome back</h1><p class="auth-sub">Continue your study progress.</p><form id="login-form"><div class="auth-group"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div><div class="auth-group"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="auth-button">Log in</button></form><div class="auth-divider">or continue with</div><button class="auth-button alt" id="google">Continue with Google</button><div class="auth-error" id="error" hidden></div><div class="auth-links">No account? <a href="/register.html">Create one free</a><br><a href="/">Back to StudyTools</a></div></section></main><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><script src="/js/firebase-config.js"></script><script>firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),error=document.querySelector('#error');function show(e){error.hidden=false;error.textContent=e}document.querySelector('#login-form').addEventListener('submit',async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword(email.value,password.value);location.href='/dashboard.html'}catch(x){show('We could not sign you in. Check your email and password.')}});document.querySelector('#google').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());location.href='/dashboard.html'}catch(x){show(x.message)}};</script></body></html>
