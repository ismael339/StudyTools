<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | StudyTools</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/css/auth-workspace.css"></head><body><main class="profile-shell"><nav class="profile-nav"><a href="/">StudyTools</a><div class="links"><a href="/dashboard.html">Dashboard</a><a href="/pro.html">Pro</a><a href="#" id="logout">Log out</a></div></nav><section class="profile-hero"><div class="profile-avatar" id="avatar">?</div><div><h1 id="name">Your profile</h1><p class="profile-muted" id="email">Loading account…</p><span class="profile-muted" id="plan">Free plan</span></div></section><section class="profile-section"><h2>Your progress</h2><div class="stats"><div class="profile-card stat"><strong id="ai">0</strong><span>AI Tutor questions</span></div><div class="profile-card stat"><strong id="exam">0</strong><span>Exam Solver uses</span></div><div class="profile-card stat"><strong id="gpa">0</strong><span>GPA calculations</span></div><div class="profile-card stat"><strong id="streak">0</strong><span>Study streak</span></div></div></section><section class="profile-section"><h2>Achievements</h2><div class="achievement-grid"><div class="profile-card achievement" data-id="first-question">🎯<br>First question</div><div class="profile-card achievement" data-id="ten-questions">🔥<br>10 questions</div><div class="profile-card achievement" data-id="first-gpa">📊<br>First GPA</div><div class="profile-card achievement" data-id="week-streak">📅<br>7-day streak</div></div><button class="share-button" id="share">Share profile</button></section></main><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><script src="/js/firebase-config.js"></script><script>firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();auth.onAuthStateChanged(async user=>{if(!user)return location.href='/login.html';email.textContent=user.email;avatar.textContent=(user.email[0]||'?').toUpperCase();const snap=await db.collection('users').doc(user.email).get();if(snap.exists){const d=snap.data();name.textContent=d.name||user.displayName||'Your profile';plan.textContent=d.plan==='premium'?'Pro plan':'Free plan';const s=d.stats||{};ai.textContent=s.aiTutor||0;exam.textContent=s.examSolver||0;gpa.textContent=s.gpaCalculator||0;streak.textContent=s.streakDays||0;(d.achievements||[]).forEach(id=>document.querySelector(`[data-id="${id}"]`)?.classList.add('unlocked'))}});logout.onclick=e=>{e.preventDefault();auth.signOut().then(()=>location.href='/')};share.onclick=()=>navigator.share?navigator.share({title:'My StudyTools profile',url:location.href}):navigator.clipboard.writeText(location.href);</script></body></html>
